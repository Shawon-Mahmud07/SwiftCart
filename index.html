<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftCart - Best Collection For You</title>
  <!-- Frameworks & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="https://img.icons8.com/fluency/48/shopping-bag.png">
  <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
  <!-- Sticky Navigation Header -->
  <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 shadow-md">
    <nav class="navbar container mx-auto px-4 py-2 lg:py-4">

      <!-- Branding -->
      <div class="navbar-start">
        <a href="#" class="group flex items-center gap-2">
          <span
            class="text-2xl lg:text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent tracking-tighter">
            SwiftCart
          </span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal p-0 gap-1 font-semibold text-gray-600">
          <li><a class="hover:bg-indigo-50 hover:text-indigo-600 rounded-lg px-4 py-2 transition-all">Home</a></li>
          <li><a class="hover:bg-indigo-50 hover:text-indigo-600 rounded-lg px-4 py-2 transition-all">Products</a></li>
          <li><a class="hover:bg-indigo-50 hover:text-indigo-600 rounded-lg px-4 py-2 transition-all">About</a></li>
          <li><a class="hover:bg-indigo-50 hover:text-indigo-600 rounded-lg px-4 py-2 transition-all">Contact</a></li>
        </ul>
      </div>

      <!-- Actions: Cart & Mobile Menu -->
      <div class="navbar-end flex items-center gap-1 lg:gap-3">
        <!-- Shopping Cart -->
        <div class="relative group">
          <button class="btn btn-ghost btn-circle hover:bg-indigo-50 text-gray-700">
            <div class="indicator">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <span
                class="badge badge-sm indicator-item bg-indigo-600 border-none text-white font-bold h-5 w-5 p-0 shadow-lg">0</span>
            </div>
          </button>
        </div>

        <!-- Mobile Dropdown -->
        <div class="dropdown dropdown-end lg:hidden">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle hover:bg-indigo-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </div>
          <ul tabindex="0"
            class="menu menu-sm dropdown-content mt-4 z-[1] p-3 shadow-2xl bg-white rounded-2xl w-60 border border-gray-100 animate-in fade-in zoom-in duration-200">
            <li><a class="py-3 px-4 font-bold text-indigo-600 bg-indigo-50 rounded-xl mb-1">Home</a></li>
            <li><a class="py-3 px-4 font-medium hover:bg-gray-50 rounded-xl mb-1">Products</a></li>
            <li><a class="py-3 px-4 font-medium hover:bg-gray-50 rounded-xl mb-1">About</a></li>
            <li><a class="py-3 px-4 font-medium hover:bg-gray-50 rounded-xl">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

<main>
  <!-- Hero Section: Background Image with Gradient Overlay -->
  <section class="relative min-h-[500px] lg:min-h-[650px] flex items-center overflow-hidden">

    <!-- Background Visuals -->
    <div class="absolute inset-0 z-0">
      <img src="./assets/banner-image.png" alt="Fashion Banner" class="w-full h-full object-cover object-center">
      <!-- Responsive Gradient for Text Readability -->
      <div
        class="absolute inset-0 bg-gradient-to-r from-[#121a29] via-black/70 to-transparent">
      </div>
    </div>

    <!-- Content Container -->
    <div class="container mx-auto px-5 lg:px-2 z-10">
      <div class="max-w-2xl lg:max-w-4xl text-left text-white">

        <h1 class="text-4xl md:text-6xl lg:text-7xl font-extrabold leading-[1.1] mb-6 tracking-tight">
          Best Collection For You
        </h1>

        <p
          class="text-base md:text-lg lg:text-xl text-gray-200 mb-10 max-w-lg mx-auto lg:mx-0 leading-relaxed font-light">
          Discover the latest trends in fashion, electronics, and more. Shop with confidence and style at SwiftCart.
        </p>

        <!-- Call to Action -->
        <div class="flex justify-start">
          <button
            class="px-10 py-4 bg-[#4F46E5] hover:bg-[#4338CA] text-white font-bold text-lg rounded-lg shadow-[0_10px_20px_-5px_rgba(79,70,229,0.4)] transition-all transform hover:-translate-y-1 active:scale-95 cursor-pointer">
            Shop Now
          </button>
        </div>

      </div>
    </div>
  </section>
</main>

  
</body>

</html>
